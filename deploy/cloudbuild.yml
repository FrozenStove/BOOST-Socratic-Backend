# prettier-ignore
steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend:$SHORT_SHA",
        "-t",
        "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend:latest",
        ".",
      ]

  # 2. Push the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "--all-tags",
        "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend",
      ]

  # 3. Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "boost-socratic-backend",
        "--image",
        "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend:$SHORT_SHA",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "3010",
        "--set-env-vars",
        "NODE_ENV=production",
      ]
logsBucket: "gs://ucsf-medical-education-app-build-logs"

images:
  - "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/github.com/frozenstove/boost-socratic-backend:latest"
